name: CI

# Compile + style gate on PRs and pushes to main. The in-engine validation
# suite is NOT run here — scenario runs need a windowed engine, so the suite
# stays local, run before merging (./validate.ps1; it is the Definition of
# Done's gate, this workflow is just the floor).
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compile:
    name: Scripts compile
    runs-on: ubuntu-latest
    container:
      # Must match GODOT_VERSION in deploy.yml and src/project.godot's
      # features tag — the env context is not available in container.image,
      # so the tag is spelled out here.
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        # Materializes the validation addon into src/addons so the project
        # scan matches a developer checkout. setup.sh is tracked
        # non-executable — invoke via bash.
        run: bash setup.sh

      - name: Import assets
        run: godot --headless --import --path src > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Load every script and scene (headless runtime pass)
        # Deliberately not an editor pass: `--editor --quit-after N` never
        # compiles script bodies, so a duplicate dictionary key — and a file of
        # pure garbage — came back clean at every frame count tried.
        # ResourceLoader.load() is the only thing that compiles, so
        # compile_check.gd walks the project. Mirrors src/tools/check_scripts.ps1
        # exactly: three gates, because silence used to read as success. Runtime
        # logs are held strict — the known UID noise (CLAUDE.md § Known issues)
        # is editor-mode only, which is why the import step above is gated on
        # its exit code alone and its log is no longer grepped.
        #
        # Each gate records into $fail rather than exiting: `!` and `||` are
        # exempt from `set -e`, so only the LAST command's status would reach
        # GitHub otherwise, silently discarding every earlier verdict.
        run: |
          set +e
          godot --headless --path src --script res://tools/compile_check.gd > /tmp/compile.log 2>&1
          status=$?
          set -e
          cat /tmp/compile.log

          fail=0
          grep -q '^COMPILE CHECK COMPLETE: [1-9]' /tmp/compile.log ||
            { echo "No completion marker, or the walk reached no scripts."; fail=1; }
          if grep -hE '^(USER |SCRIPT )?ERROR:|^COMPILE FAIL:' /tmp/compile.log; then fail=1; fi
          [ "$status" -eq 0 ] || { echo "Compile pass exited $status."; fail=1; }
          exit $fail

  lint:
    name: Format + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        # 4.5.0+ required: earlier releases cannot parse @abstract.
        run: pip install "gdtoolkit==4.*"

      - name: gdformat + gdlint
        # Repo-owned scripts only — src/addons is vendored and not ours to
        # style. Mirrors src/tools/lint.ps1.
        run: |
          git ls-files -- src | grep '\.gd$' | grep -v '^src/addons/' > /tmp/gd_files.txt
          xargs -a /tmp/gd_files.txt gdformat --check
          xargs -a /tmp/gd_files.txt gdlint
