name: Playtest

# Branch playtest deploys (D8): every branch push, main included, exports
# the Web build and uploads it to a Cloudflare R2 bucket under
# <repo>/<branch>/, giving each branch a stable playtest URL:
#
#   https://<bucket-public-url>/<repo>/<branch>/index.html
#
# itch.io release stays tag-driven (D7, deploy.yml) — this workflow never
# touches it.
#
# branches: ["**"] rather than a bare `push:` — a tag push would otherwise
# also match, uploading to an R2 prefix playtest-cleanup.yml can never prune
# (its delete trigger excludes tags), leaking forever.
#
# Setup — full walkthrough in README § Branch playtests. Once per Cloudflare
# account: the shared bucket + its public dev URL + an API token with
# "Workers R2 Storage: Edit". Per repo: the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets (they do NOT copy through "Use this
# template"), plus the optional R2_PUBLIC_BASE repository variable for
# clickable links in the run summary.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  # Must match ci.yml/deploy.yml's container tags and src/project.godot's
  # features tag.
  GODOT_VERSION: 4.7.1
  # One shared bucket for every game on the account; uploads are keyed
  # <repo>/<branch>/, so repos can never collide.
  R2_BUCKET: playtests
  # Optional repository VARIABLE (not secret): the bucket's public base URL
  # (https://pub-<hash>.r2.dev) — set it to get a clickable link in the run
  # summary. The hash is per-bucket and only visible in the dashboard, so the
  # workflow cannot derive it.
  R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Web export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Stage export templates
        run: |
          mkdir -v -p build/web ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Web export
        run: godot --headless --path src --export-release "Web" "$(pwd)/build/web/index.html"

      - name: Prove the export produced a build
        # Same exit-0 trap as deploy.yml: the files are the check.
        run: |
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 3

  publish:
    name: Publish to Cloudflare R2
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Content types are set per object because R2 serves whatever metadata
        # the upload stored — miss it and browsers download index.html instead
        # of rendering it. no-cache keeps testers off stale builds at the edge.
        run: |
          REPO_SLUG=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          BRANCH_SLUG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          PREFIX="$REPO_SLUG/$BRANCH_SLUG"
          echo "prefix=$PREFIX" >> "$GITHUB_ENV"
          cd build/web
          # What this build wrote, so playtest-cleanup.yml can prune the
          # prefix exactly: R2 has no recursive delete and wrangler has no
          # object-list command. Written before the loop so it lists — and
          # therefore uploads, and later deletes — itself.
          ls -1 > _manifest.txt
          for f in *; do
            case "$f" in
              *.txt)  CT="text/plain; charset=utf-8" ;;
              *.html) CT="text/html; charset=utf-8" ;;
              *.js)   CT="text/javascript" ;;
              *.wasm) CT="application/wasm" ;;
              *.pck)  CT="application/octet-stream" ;;
              *.png)  CT="image/png" ;;
              *.ico)  CT="image/x-icon" ;;
              *.json) CT="application/json" ;;
              *)      CT="application/octet-stream" ;;
            esac
            npx wrangler@4 r2 object put "$R2_BUCKET/$PREFIX/$f" --file "$f" --content-type "$CT" --cache-control "no-cache" --remote
          done

      - name: Playtest URL
        run: |
          echo "### Playtest build" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$R2_PUBLIC_BASE" ]; then
            echo "$R2_PUBLIC_BASE/$prefix/index.html" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded to r2://$R2_BUCKET/$prefix/ — the link is your bucket's public URL + /$prefix/index.html. Set the R2_PUBLIC_BASE repository variable to get a clickable link here." >> "$GITHUB_STEP_SUMMARY"
          fi
